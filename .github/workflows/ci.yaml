name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "22"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yaml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yaml'

  # ----------------------------------------------------------------------------
  # Backend
  # ----------------------------------------------------------------------------
  backend:
    name: Backend - lint & tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: ci-dummy-secret-not-used-in-prod
      DEBUG: "0"
      ALLOWED_HOSTS: "*"
      POSTGRES_DB: rolled
      POSTGRES_USER: rolled
      POSTGRES_PASSWORD: rolled
      POSTGRES_HOST: localhost

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rolled
          POSTGRES_PASSWORD: rolled
          POSTGRES_DB: rolled
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg-isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Linters

      - name: Ruff - lint
        run: ruff check --output-format=github .

      - name: Ruff - format
        run: ruff format --check --diff .

      # Django checks

      - name: Django - system checks
        run: python manage.py check

      - name: Django - migrations without generation
        run: python manage.py makemigrations --check --dry-run

      # Tests
      - name: Tests
        run: pytest -q --cov --cov-report=term-missing

  # ----------------------------------------------------------------------------
  # Backend: Static types
  # ----------------------------------------------------------------------------
  backend-types:
    name: Backend - mypy
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: ci-dummy-secret-not-used-in-prod
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: mypy
        run: mypy .

  # ----------------------------------------------------------------------------
  # Frontend
  # ----------------------------------------------------------------------------
  frontend:
    name: Frontend - lint & build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint -- --max-warnings=0
      - name: Prettier
        run: npm run format:check
      - name: TypesScript
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Tetsts
        run: npm test --if-present -- --run
  # ----------------------------------------------------------------------------
  # ----------------------------------------------------------------------------
  ci:
    name: CI OK
    if: always()
    needs: [changes, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo "backend: ${{ needs.backend.result }}"
          echo "frontend: ${{ needs.frontend.result }}"
          for results in "${{ needs.backend.result }}" "${{ needs.frontend.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::A job has failed"
              exit 1
            fi
          done
          echo "All OK"
