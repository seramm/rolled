# ==============================================================================
# Ruff
# ==============================================================================
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "**/migrations/**",
    ".venv",
    "staticfiles",
    "media",
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "DTZ",
    "DJ",
    "T20",
    "SIM",
    "TID",
    "PTH",
    "RET",
    "ARG",
    "RUF",
    "S",
]
ignore = [
    "E501",
    "B008",
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"**/settings*.py" = ["F403", "F405", "E402", "S105"]
"**/settings/*.py" = ["F403", "F405", "E402", "S105"]
"**/tests/**" = ["S101", "ARG001", "ARG002", "PLR2004"]
"**/test_*.py" = ["S101", "ARG001", "ARG002"]
"manage.py" = ["T20"]
"conftest.py" = ["ARG001"]
"routers.py" = ["ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["config", "apps"]
section-order = ["future", "standard-library", "third-party", "django", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
django = ["django", "ninja"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ==============================================================================
# mypy + django-stubs
# ==============================================================================
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/", ".venv/"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["*.migrations.*", "*.tests.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings"

# ==============================================================================
# pytest
# ==============================================================================
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "--strict-markers --reuse-db"
testpaths = ["."]

[tool.coverage.run]
source = ["."]
omit = ["*/migrations/*", "*/tests/*", "manage.py", "*/settings*"]
